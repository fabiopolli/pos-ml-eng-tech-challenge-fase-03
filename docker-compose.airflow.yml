services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      DATA_REPOSITORY_URL: ${DATA_REPOSITORY_URL:-https://dagshub.com/deniscelclaro/pos-ml-eng-tech-challenge-fase-03.git}
      DATA_REPOSITORY_BRANCH: ${DATA_REPOSITORY_BRANCH:-main}
      DATASET_RELATIVE_PATH: ${DATASET_RELATIVE_PATH:-data/medical_tc_train.csv}
      TRIAGE_RAW_CSV: /opt/airflow/project/data/medical_tc_train.csv
      TRIAGE_MODELS_DIR: /opt/airflow/project/models
      TRIAGE_REPORTS_DIR: /opt/airflow/project/reports/figures
      TRIAGE_TRAINING_CONFIG: /opt/airflow/project/configs/training.yaml
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./configs:/opt/airflow/project/configs:ro
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models
      - ./reports:/opt/airflow/project/reports
      - airflow-state:/opt/airflow
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  airflow-state:
