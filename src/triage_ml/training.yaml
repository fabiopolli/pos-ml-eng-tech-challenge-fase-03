# Hyperparameters for the baseline text classifier.
#
# These values are loaded by ``triage_ml.models.train.run_training`` and
# persisted (lightly) into ``metadata.json`` so that a model version is
# reproducible from the version control history.

random_state: 42
sample_size: 5000
test_size: 0.2
cv_folds: 5
language: en
task_type: multiclass_text_classification

# Fase 2 (Etapa 5) — ``dataset_sizing`` is the catalog of ``sample_size``
# values that the optimization DAG (``triage_ml_retraining_optimization``)
# iterates on. Each entry generates a separate ``models/<versão>/`` artifact.
# Operators may override the catalog at runtime via ``TRIAGE_DATASET_SLICES``
# (comma separated integers). Empty/missing falls back to ``[sample_size]``.
#
# The minimum entry is bounded by ``prepare_dataset`` (``>= 2000``) and the
# upper bound is the size of the eligible rows in the raw CSV. The canonical
# dataset has 7,489 eligible rows after conflict removal, so these three
# reproducible cuts stay within the available population.
dataset_sizing: [5000, 6000, 7000]

label_mapping:
  1: neoplasms
  2: digestive system diseases
  3: nervous system diseases
  4: cardiovascular diseases
  5: general pathological conditions

# TF-IDF preprocessing. Conservative defaults that work well on medical
# abstracts of ~1k characters (median). Tokens are kept simple and
# reproducible so that downstream serialization is deterministic.
tfidf:
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  sublinear_tf: true
  lowercase: true
  token_pattern: "(?u)\\b\\w+\\b"

# Logistic Regression hyperparameters (used when ``classifier: logreg``).
logreg:
  solver: lbfgs
  max_iter: 2000
  class_weight: balanced
  C: 1.0
  random_state: 42

# LinearSVC hyperparameters (used when ``classifier: linear_svc``).
linear_svc:
  class_weight: balanced
  C: 1.0
  random_state: 42

# The version is generated as YYYYMMDDTHHMMSSZ-<input_hash> and is never overwritten.
model_name: triage_ml_tfidf_logreg
