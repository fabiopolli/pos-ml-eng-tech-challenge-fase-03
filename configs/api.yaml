api:
  # ISO 639-1 codes the API will accept. Anything outside this set
  # produces a 422 with error_code="unsupported_language".
  supported_languages:
    - en

  # Minimum number of characters in `text` for a stable detection.
  # Inputs shorter than this produce 422 with
  # error_code="text_too_short_for_language_check".
  min_text_chars_for_language_check: 20

  # Lower bound for the detector's normalized probability in [0, 1]
  # (`LanguageIdentifier(..., norm_probs=True)`). Detections below this value
  # are treated as indeterminate and rejected with
  # error_code="indeterminate_language". Defaults to 0.0 because
  # the threshold requires calibration on representative inputs; the
  # normalized value is not a calibrated confidence estimate.
  min_language_score: 0.0
